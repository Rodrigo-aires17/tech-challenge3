name: CI - analytics

on:
  push:
    branches: [main]
    paths:
      - "services/analytics/**"
      - ".github/workflows/ci-analytics.yml"
      - ".github/workflows/reusable-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/analytics/**"
      - ".github/workflows/ci-analytics.yml"
      - ".github/workflows/reusable-ci-cd.yml"

jobs:
  ci-cd:
    uses: ./.github/workflows/reusable-ci-cd.yml
    with:
      service_name: analytics
    secrets: inherit
