apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting
  namespace: togglemaster
  labels:
    app: targeting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting
  template:
    metadata:
      labels:
        app: targeting
    spec:
      containers:
        - name: targeting
          image: 589138972429.dkr.ecr.us-east-1.amazonaws.com/togglemaster/targeting/togglemaster/targeting:v0.0.1-init
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: targeting-config
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: targeting-db-credentials, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: targeting-db-credentials, key: DB_PORT }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: targeting-db-credentials, key: DB_NAME }
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: targeting-db-credentials, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: targeting-db-credentials, key: DB_PASSWORD }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
