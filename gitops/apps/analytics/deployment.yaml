apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: togglemaster
  labels:
    app: analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      serviceAccountName: analytics-sa
      containers:
        - name: analytics
          image: <ECR_REGISTRY>/togglemaster/analytics:v0.0.1-init
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: analytics-config
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
